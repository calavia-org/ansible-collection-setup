---
logging_packages:
  - rsyslog
  - rsyslog-mysql
  - python3-pymysql

logging_user: 'syslog'
logging_group: 'syslog'

logging_service: 'rsyslog'
logging_log_path: '/var/log/rsyslog'
logging_log_path_mode: '0640'

logging_global_config_file: '/etc/rsyslog.conf'
logging_facilities_config_file: '/etc/rsyslog.d/50-default.conf'
logging_config_files_mode: '0640'

logging_receiver_tcp: yes
logging_allowed_sender: '*.example.net'

logging_remote_tcp:
  enabled: yes
  target: 'rsyslog.example.net'
  port: 514

logging_remote_mysql:
  enabled: yes
  template: 'StdSQLFormat'
  server: 'mysql.example.net'
  db: 'rsyslog'
  uid: 'rsyslog'
  pwd: 'rsyslog'

# https://wiki.gentoo.org/wiki/Rsyslog
logging_facilities:
  - id: 0
    name: 'kern'
    description: 'kernel messages'
    local_severities: "{{ logging_facility_severities['kern'].local_severities | default([]) }}"
    tcp_severities: "{{ logging_facility_severities['kern'].tcp_severities | default([]) }}"
    mysql_severities: "{{ logging_facility_severities['kern'].mysql_severities | default([]) }}"

  - id: 1
