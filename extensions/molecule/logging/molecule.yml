---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    image: "geerlingguy/docker-debian12-ansible:latest"
    pre_build_image: true
provisioner:
  name: ansible
  env:
    MOLECULE_PROJECT_DIRECTORY: "extensions/molecule/logging"
  config_options:
    defaults:
      interpreter_python: auto_silent
verifier:
  name: ansible
