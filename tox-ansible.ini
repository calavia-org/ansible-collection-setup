[ansible]
# Keep only the two latest supported ansible-core versions so CI stays fast and
# relevant. Older versions are skipped; `devel` and the next `milestone` are
# treated as preview tracks and are also skipped here because the consumer
# release workflow can opt into the full matrix separately.
skip =
    devel
    2.16
    2.17
    2.18
    2.19
    py3.10
    py3.11
    py3.14

[testenv]
allowlist_externals =
    bash
passenv =
    MOLECULE_PROJECT_DIRECTORY
setenv =
    ANSIBLE_COLLECTIONS_PATH = {env_tmp_dir}/collections:{toxinidir}/collections:{env:HOME}/.ansible/collections
    unit: PYTEST_ADDOPTS = --junitxml={toxinidir}/junit-{envname}.xml
    integration: PYTEST_ADDOPTS = --junitxml={toxinidir}/junit-{envname}.xml
commands_pre =
    bash -c 'mkdir -p {env_tmp_dir}/collection_build && cd {toxinidir} && git archive HEAD | tar xf - -C {env_tmp_dir}/collection_build'
    bash -c 'cd {env_tmp_dir}/collection_build/collections/ansible_collections/calaviaorg/setup && ansible-galaxy collection build && ansible-galaxy collection install --force calaviaorg-setup-*.tar.gz -p {env_tmp_dir}/collections'
    bash -c 'cd {env_tmp_dir}/collections/ansible_collections/calaviaorg/setup && git init .'

[testenv:sanity-py3.12-milestone]
commands =
    bash -c 'cd {env_tmp_dir}/collections/ansible_collections/calaviaorg/setup && ansible-test sanity --local --requirements --python 3.12'

[testenv:sanity-py3.13-milestone]
commands =
    bash -c 'cd {env_tmp_dir}/collections/ansible_collections/calaviaorg/setup && ansible-test sanity --local --requirements --python 3.13'
