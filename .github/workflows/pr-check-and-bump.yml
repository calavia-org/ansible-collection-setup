name: PR Check and Auto-Bump

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  pr-check-and-bump:
    uses: calavia-org/workflows-lib/.github/workflows/pr-check-and-bump.yml@v0
    with:
      allowed-branch-pattern: "^(major|feat|fix|doc|chore|dependabot)/.+"
      allowed-target-branches: "main,release/*"
      version-file: "collections/ansible_collections/calaviaorg/setup/galaxy.yml"
      fail-on-invalid-branch: true
      require-conventional-commits: true
      no-bump-branch-pattern: "^chore/.+"
    secrets:
      # Fine-grained PAT (contents: read/write on this repo) so the auto-bump
      # push does NOT re-trigger pull_request runs in approval-required state
      # (GITHUB_TOKEN pushes always do). See workflows-lib pr-check-and-bump.
      github-token: ${{ secrets.AUTO_BUMP_TOKEN }}
