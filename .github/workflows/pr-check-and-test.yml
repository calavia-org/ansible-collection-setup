name: PR Check and Test

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    paths:
      - collections/ansible_collections/calaviaorg/setup/playbooks/**
      - collections/ansible_collections/calaviaorg/setup/plugins/**
      - collections/ansible_collections/calaviaorg/setup/roles/**
      - tests/**
      - extensions/molecule/**
      - galaxy.yml
      - requirements.yml
      - tox-ansible.ini
      - .github/workflows/pr-check-and-test.yml
      - .pre-commit-config.yaml
      - pyproject.toml
      - setup.py
      - setup.cfg
      - requirements.txt

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install tox-ansible
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
      - name: Run lint checks
        run: |
          ansible-lint
          yamllint -c .yamllint .
      - name: Run unit tests
        run: tox -e unit-py3.12-2.17 --ansible --conf tox-ansible.ini
      - name: Run integration tests
        run: tox -e integration-py3.12-milestone --ansible --conf tox-ansible.ini
