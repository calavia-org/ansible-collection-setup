name: PR Check and Test

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    paths:
      - collections/ansible_collections/calaviaorg/setup/playbooks/**
      - collections/ansible_collections/calaviaorg/setup/plugins/**
      - collections/ansible_collections/calaviaorg/setup/roles/**
      - tests/**
      - extensions/molecule/**
      - galaxy.yml
      - requirements.yml
      - tox-ansible.ini
      - .github/workflows/pr-check-and-test.yml
      - .pre-commit-config.yaml
      - pyproject.toml
      - setup.py
      - setup.cfg
      - requirements.txt

permissions:
  contents: read

jobs:
  pr-check-and-test:
    uses: calavia-org/workflows-lib/.github/workflows/pr-check-and-test.yml@v0
    with:
      technology: ansible
      run-pre-commit: true
      run-lint: false
      run-build: false
      run-tests: true
      run-unit-tests: true
      run-integration-tests: true
      python-version: '3.12'
      tox-ini: tox-ansible.ini
      test-command: python -m tox --ansible -e unit-py3.12-2.17 --conf tox-ansible.ini
      integration-test-command: python -m tox --ansible -e integration-py3.12-milestone --conf tox-ansible.ini
      fail-on-missing: false
      cache-enabled: true
      report-enabled: false
      comment-on-pr: false
      timeout-minutes: 30
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
